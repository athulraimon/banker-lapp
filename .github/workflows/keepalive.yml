name: Keep API warm

# Render's free tier sleeps a service after 15 minutes with no traffic, and the
# next request then waits ~50s for a cold start. Pinging /health keeps it awake
# during the hours anyone actually uses the app.
#
# Deliberately not every 5 minutes around the clock: that burns Render's monthly
# free instance hours for nothing while everyone is asleep. This covers roughly
# 09:00-23:00 UTC, which is the window that matters for a European race weekend.
#
# Set the repository variable API_URL (Settings -> Secrets and variables ->
# Actions -> Variables) to your Render API URL, e.g.
# https://banker-lapp-api.onrender.com

on:
  schedule:
    - cron: '*/10 9-23 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "API_URL variable is not set; nothing to ping."
            exit 0
          fi
          # --max-time 90 because a cold start legitimately takes ~50s; a
          # shorter timeout would report failure for a service that is fine.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "${{ vars.API_URL }}/health" || echo "000")
          echo "GET /health -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Health check returned $code"
          fi
